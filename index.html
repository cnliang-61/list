<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自撰程式列表</title>
    <style>
        :root {
            --primary-color: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: var(--primary-color);
            letter-spacing: -0.025em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .card h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 12px;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card a {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-all;
            margin-bottom: 24px;
            transition: color 0.15s ease;
        }

        .card a:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .qr-wrapper {
            width: 200px;
            height: 200px;
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        footer {
            text-align: center;
            margin-top: 50px;
            color: var(--text-muted);
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>自撰程式列表</h1>
        </header>

        <div class="grid">
            <!-- 第一部份 -->
            <div class="card">
                <h2>基層糖尿病學會課程查詢</h2>
                <a href="https://tacd-finder.onrender.com/" target="_blank" rel="noopener noreferrer">https://tacd-finder.onrender.com/</a>
                <div class="qr-wrapper">
                    <img src="1.png" alt="基層糖尿病學會課程查詢 QR Code">
                </div>
            </div>

            <!-- 第二部份 -->
            <div class="card">
                <h2>飲食紀錄系統</h2>
                <a href="https://cnliang-61.github.io/DM_diet/" target="_blank" rel="noopener noreferrer">https://cnliang-61.github.io/DM_diet/</a>
                <div class="qr-wrapper">
                    <img src="2.png" alt="飲食紀錄系統 QR Code">
                </div>
            </div>

            <!-- 第三部份 -->
            <div class="card">
                <h2>地圖及航跡檢視器</h2>
                <a href="https://cnliang-61.github.io/WMTS_viewer/" target="_blank" rel="noopener noreferrer">https://cnliang-61.github.io/WMTS_viewer/</a>
                <div class="qr-wrapper">
                    <img src="3.png" alt="地圖及航跡檢視器 QR Code">
                </div>
            </div>
        </div>

        <footer>
            <p>© 自撰程式列表</p>
        </footer>
    </div>
</body>
</html>
